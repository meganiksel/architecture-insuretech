apiVersion: v1
kind: Service
metadata:
  name: scaletestapp
  labels:
    app: scaletestapp
  annotations:
    # Аннотации Prometheus и на уровне Service — для scrape-конфигов,
    # ориентирующихся на сервисы.
    prometheus.io/scrape: "true"
    prometheus.io/port: "8080"
    prometheus.io/path: "/metrics"
spec:
  type: ClusterIP
  selector:
    app: scaletestapp
  ports:
    - name: http
      port: 80
      targetPort: 8080
      protocol: TCP
