apiVersion: apps/v1
kind: Deployment
metadata:
  name: scaletestapp
  labels:
    app: scaletestapp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: scaletestapp
  template:
    metadata:
      labels:
        app: scaletestapp
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
    spec:
      containers:
        - name: scaletestapp
          # Оригинальный образ ghcr.io/yandex-practicum/scaletestapp:latest
          # собран только под linux/amd64 и не запускается на arm64
          # Поэтому используется локально собранный
          # эквивалент (см. ./app/Dockerfile, ./app/app.py).
          # Сборка: minikube image build -t scaletestapp:local Task2/app
          image: scaletestapp:local
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 8080
          # ⚠️ В задании указан limit memory=30Mi для оригинального
          # go-приложения. На локально собранном Python/Flask 30Mi
          # не хватит даже на старт интерпретатора, поэтому поднял
          # лимит до 80Mi. Поведение HPA от этого не меняется:
          # target=80% от limit, при росте нагрузки утилизация всё
          # равно пробивает потолок и HPA добавляет реплики.
          resources:
            requests:
              memory: "40Mi"
              cpu: "50m"
            limits:
              memory: "80Mi"
              cpu: "200m"
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
