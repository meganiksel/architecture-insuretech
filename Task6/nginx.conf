worker_processes auto;

events {
    worker_connections 1024;
}

http {
    # Зона памяти 10 МБ хранит счётчики по IP клиента.
    # rate=10r/m  ->  не более 10 запросов в минуту с одного источника.
    # Если партнёры аутентифицируются по API-ключу, ключ зоны можно
    # заменить на $http_x_api_key или $http_authorization.
    limit_req_zone $binary_remote_addr zone=partner_zone:10m rate=10r/m;

    # При превышении лимита возвращаем 429 Too Many Requests
    # (по умолчанию Nginx отдаёт 503).
    limit_req_status 429;

    # Настройка upstream для балансировки нагрузки
    upstream backend_servers {
        server backend1.example.com;
        server backend2.example.com;
        server backend3.example.com;
    }

    server {
        listen 80;

        location / {
            # burst=0  -> запросы свыше лимита сразу отбрасываются.
            # nodelay  -> разрешённые запросы пропускаем без задержки.
            limit_req zone=partner_zone burst=0 nodelay;

            proxy_pass http://backend_servers;
        }
    }
}
